<!Doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>GitHub Data Finder</title>
  <meta name="description" content="Look up any GitHub user's profile, stats, and top repositories.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="GitHub Data Finder">
  <meta name="theme-color" content="#fafafa">
  <link rel="manifest" href="site.webmanifest">

  <!-- Place favicon.ico in the root directory -->
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">

  <!-- Set the theme before first paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      var stored = localStorage.getItem("gdf-theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", stored || (prefersDark ? "dark" : "light"));
    })();
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" type="text/css" href="./styles/normalize.css">
  <link rel="stylesheet" type="text/css" href="./styles/theme.css">
  <link rel="stylesheet" type="text/css" href="./styles/main.css">

  <!-- BootStrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css">
</head>

<body>

  <div class="app">

    <header class="app-header">
      <div class="brand">
        <i class="bi bi-github brand-icon"></i>
        <h1>GitHub <span>Data Finder</span></h1>
      </div>

      <label class="theme-toggle" title="Switch theme">
        <input type="checkbox" id="theme-toggle-input">
        <span class="theme-toggle-track">
          <i class="bi bi-sun-fill"></i>
          <i class="bi bi-moon-stars-fill"></i>
          <span class="theme-toggle-thumb"></span>
        </span>
      </label>
    </header>

    <main class="app-main">

      <section class="search-section">
        <h2 class="search-heading">Find anyone on GitHub</h2>
        <p class="search-subheading">Profile details, stats, and top repositories in one place.</p>

        <form id="search-form" class="search-form" autocomplete="off">
          <i class="bi bi-search search-icon"></i>
          <input type="text" id="username" name="username" class="search-input"
            placeholder="Search a GitHub username" aria-label="GitHub username">
          <button type="submit" class="search-btn">Search</button>
        </form>

        <div class="chip-row" id="quick-row">
          <span class="chip-label">Try:</span>
          <div class="chip-list" id="quick-chips"></div>
        </div>

        <div class="chip-row" id="history-row" hidden>
          <span class="chip-label">Recent:</span>
          <div class="chip-list" id="history-chips"></div>
          <button type="button" id="clear-history" class="chip-clear">Clear</button>
        </div>
      </section>

      <section class="result-section" id="result-section">

        <div class="state state-empty" id="state-empty">
          <i class="bi bi-github state-icon"></i>
          <p class="state-title">No user searched yet</p>
          <p class="state-text">Enter a GitHub username above to get started.</p>
        </div>

        <div class="state state-loading" id="state-loading" hidden>
          <div class="skeleton-card">
            <div class="skeleton skeleton-avatar"></div>
            <div class="skeleton-lines">
              <div class="skeleton skeleton-line w-40"></div>
              <div class="skeleton skeleton-line w-25"></div>
              <div class="skeleton skeleton-line w-60"></div>
            </div>
          </div>
          <div class="skeleton-grid">
            <div class="skeleton skeleton-repo"></div>
            <div class="skeleton skeleton-repo"></div>
            <div class="skeleton skeleton-repo"></div>
          </div>
        </div>

        <div class="state state-error" id="state-error" hidden>
          <i class="bi bi-exclamation-triangle state-icon" id="error-icon"></i>
          <p class="state-title" id="error-title">Something went wrong</p>
          <p class="state-text" id="error-text"></p>
          <button type="button" id="retry-btn" class="btn-secondary">Try again</button>
        </div>

        <div class="state state-result" id="state-result" hidden>
          <article class="profile-card" id="profile-card"></article>

          <section class="repos-section">
            <div class="repos-header">
              <h2>Top Repositories</h2>
              <span class="repos-count" id="repos-count"></span>
            </div>
            <div class="repos-grid" id="repos-grid"></div>
          </section>
        </div>

      </section>
    </main>

    <footer class="app-footer">
      <p>Built with the <a href="https://docs.github.com/en/rest/users/users" target="_blank"
          rel="noopener">GitHub REST API</a></p>
    </footer>

  </div>

  <script type="module" src="scripts/main.js"></script>
  <script src="./scripts/theme.js"></script>
</body>

</html>
